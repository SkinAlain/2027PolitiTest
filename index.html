<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PolitiTest - Le Comparateur à 100 Questions</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-light: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .quiz-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 720px;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      padding: 30px;
      transition: all 0.3s ease;
    }

    /* Header & Progress */
    .header { margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    
    .meta-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .category-badge {
      display: inline-block;
      padding: 5px 14px;
      background: #eff6ff;
      color: var(--primary);
      font-weight: 600;
      font-size: 0.8rem;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .question-counter {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-light);
      background: #f8fafc;
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .progress-bar-container { display: flex; align-items: center; gap: 10px; }

    .progress-bar {
      flex-grow: 1;
      height: 8px;
      background-color: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      background-color: var(--primary);
      width: 0%;
      transition: width 0.3s ease-out;
    }

    /* Question */
    .question-section { min-height: 250px; display: flex; flex-direction: column; justify-content: center; }

    .question-text {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 30px;
      color: var(--text);
    }

    /* Options */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
    }

    .btn-option {
      padding: 16px 20px;
      border: 2px solid var(--border);
      background: #fff;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
      color: var(--text);
      position: relative;
    }

    .btn-option:hover {
      background-color: #f8fafc;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    /* Contextual hover colors */
    .btn-option[data-value="2"]:hover { border-color: #16a34a; background: #f0fdf4; color: #15803d; }
    .btn-option[data-value="1"]:hover { border-color: #86efac; background: #f0fdf4; }
    .btn-option[data-value="0"]:hover { border-color: #94a3b8; background: #f8fafc; }
    .btn-option[data-value="-1"]:hover { border-color: #fca5a5; background: #fef2f2; }
    .btn-option[data-value="-2"]:hover { border-color: #dc2626; background: #fef2f2; color: #b91c1c; }

    /* Navigation */
    .nav-controls {
      display: flex;
      justify-content: flex-start;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }

    .btn-back {
      padding: 10px 20px;
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-back:hover:not(:disabled) { background: #e2e8f0; }
    .btn-back:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Results */
    .result-card { text-align: center; }

    .top-match {
      background: #eff6ff;
      border: 2px solid var(--primary);
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .top-match span { color: var(--primary); font-weight: 600; font-size: 0.9rem; text-transform: uppercase; }
    .top-match h2 { font-size: 2.2rem; color: var(--text); margin: 10px 0; font-weight: 800; }
    .top-match p { font-size: 1.2rem; font-weight: 700; color: var(--primary); }

    #scores-list { display: flex; flex-direction: column; gap: 10px; text-align: left; }

    .party-result {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid var(--border);
      transition: transform 0.2s;
    }
    
    .party-result:hover { transform: translateX(5px); background: #f1f5f9; }

    .party-name { font-weight: 600; font-size: 1rem; color: var(--text); }
    .party-score-container { text-align: right; }
    .party-score-bar { width: 100px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 5px; }
    .party-score-fill { height: 100%; background: var(--primary); border-radius: 3px; }
    .party-score-text { font-weight: 700; color: var(--primary); font-size: 1.1rem; }

    .btn-restart {
      margin-top: 30px;
      padding: 15px 30px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .btn-restart:hover { background: var(--primary-hover); }

    .hidden { display: none !important; }

    /* Mobile optimization */
    @media (max-width: 600px) {
      .quiz-container { padding: 20px; }
      .question-text { font-size: 1.15rem; min-height: auto; }
      .btn-option { padding: 12px 15px; font-size: 0.95rem; }
      .top-match h2 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <div id="quiz-screen">
      <div class="header">
        <div class="meta-info">
          <span id="category" class="category-badge">Chargement...</span>
          <span id="counter" class="question-counter">0 / 0</span>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar">
            <div id="progress" class="progress"></div>
          </div>
        </div>
      </div>
      
      <div class="question-section">
        <div id="question" class="question-text">Préparation du test...</div>

        <div class="options-grid">
          <button class="btn-option" data-value="2" onclick="handleAnswer(2)">Tout à fait d'accord</button>
          <button class="btn-option" data-value="1" onclick="handleAnswer(1)">Plutôt d'accord</button>
          <button class="btn-option" data-value="0" onclick="handleAnswer(0)">Neutre / Indécis</button>
          <button class="btn-option" data-value="-1" onclick="handleAnswer(-1)">Plutôt pas d'accord</button>
          <button class="btn-option" data-value="-2" onclick="handleAnswer(-2)">Pas du tout d'accord</button>
        </div>
      </div>

      <div class="nav-controls">
        <button id="btn-back" class="btn-back" onclick="goBack()" disabled>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Question précédente
        </button>
      </div>
    </div>

    <div id="result-screen" class="result-card hidden">
      <h1>Vos Résultats</h1>
      <p style="margin: 10px 0 25px 0; color: var(--text-light); font-size: 1.1rem;">Voici votre affinité avec les principales formations politiques françaises :</p>
      
      <div class="top-match">
        <span>Parti le plus proche :</span>
        <h2 id="top-party-name">-</h2>
        <p id="top-party-score">-</p>
      </div>

      <div id="scores-list"></div>

      <button class="btn-restart" onclick="restartQuiz()">Refaire le test (100 questions)</button>
    </div>
  </div>

    // (Le code ci-dessous suppose que les constantes sont présentes)

    let currentQuestionIndex = 0;
    let userAnswers = []; // Historique des réponses pour permettre le retour en arrière

    // Initialisation
    function initQuiz() {
      if (typeof questions === 'undefined' || typeof parties === 'undefined') {
        document.getElementById("question").innerHTML = "<span style='color:red'>Erreur : Les données du quiz (questions/parties) manquent dans le code.</span>";
        return;
      }
      currentQuestionIndex = 0;
      userAnswers = [];
      document.getElementById("result-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      updateUI();
    }

    // Mise à jour de l'interface (question, compteur, barre, bouton retour)
    function updateUI() {
      const q = questions[currentQuestionIndex];
      const totalQ = questions.length;

      // Question et Catégorie
      document.getElementById("category").innerText = q.cat;
      document.getElementById("question").innerText = q.text;
      
      // Compteur (ex: 1 / 100)
      document.getElementById("counter").innerText = `${currentQuestionIndex + 1} / ${totalQ}`;

      // Barre de progression
      const progressPercent = ((currentQuestionIndex) / totalQ) * 100;
      document.getElementById("progress").style.width = `${progressPercent}%`;

      // Gestion du bouton retour
      const backBtn = document.getElementById("btn-back");
      backBtn.disabled = (currentQuestionIndex === 0);
    }

    // Gestion du clic sur une réponse
    function handleAnswer(value) {
      // Stocker la réponse dans l'historique
      userAnswers[currentQuestionIndex] = value;
      
      // Passer à la question suivante
      currentQuestionIndex++;

      if (currentQuestionIndex < questions.length) {
        updateUI();
        // Scroll automatique vers le haut de la carte pour les mobiles
        window.scrollTo(0, 0); 
      } else {
        showResults();
      }
    }

    // Revenir à la question précédente
    function goBack() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        updateUI();
      }
    }

    // Calcul des proximités (Distance Euclidienne) et affichage
    function showResults() {
      document.getElementById("quiz-screen").classList.add("hidden");
      document.getElementById("result-screen").classList.remove("hidden");
      window.scrollTo(0, 0);

      const totalQuestions = questions.length;
      const maxDistancePerQuestion = 4; // Écart max: |2 - (-2)|

      const results = parties.map(party => {
        let totalDistance = 0;

        // On compare l'historique des réponses de l'utilisateur aux scores du parti
        userAnswers.forEach((ans, index) => {
          const partyAns = party.scores[index];
          totalDistance += Math.abs(ans - partyAns);
        });

        const maxPossibleDistance = totalQuestions * maxDistancePerQuestion;
        // Similarité = (1 - distance_relative) * 100
        const matchPercentage = Math.round((1 - (totalDistance / maxPossibleDistance)) * 100);

        return { name: party.name, score: matchPercentage };
      });

      // Tri par affinité décroissante
      results.sort((a, b) => b.score - a.score);

      // Affichage du vainqueur
      document.getElementById("top-party-name").innerText = results[0].name;
      document.getElementById("top-party-score").innerText = `${results[0].score}% de concordance`;

      // Affichage de la liste complète
      const listContainer = document.getElementById("scores-list");
      listContainer.innerHTML = "";

      results.slice(1).forEach(res => {
        const div = document.createElement("div");
        div.className = "party-result";
        div.innerHTML = `
          <span class="party-name">${res.name}</span>
          <div class="party-score-container">
            <span class="party-score-text">${res.score}%</span>
            <div class="party-score-bar">
              <div class="party-score-fill" style="width: ${res.score}%"></div>
            </div>
          </div>
        `;
        listContainer.appendChild(div);
      });
    }

    function restartQuiz() {
      initQuiz();
    }

    // Démarrage automatique
    window.onload = initQuiz;
